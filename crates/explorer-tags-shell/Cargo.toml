[package]
name = "explorer-tags-shell"
version = "2.0.0"
edition = "2021"

[lib]
name = "ExplorerTags"
crate-type = ["cdylib"]

[dependencies]
explorer-tags-core = { path = "../explorer-tags-core" }
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.58"
windows-targets = "0.52"

[build-dependencies]
winres = "0.1"
