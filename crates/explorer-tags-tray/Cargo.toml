[package]
name = "explorer-tags-tray"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "explorer-tags-tray"
path = "src/main.rs"

[dependencies]
explorer-tags-core = { path = "../explorer-tags-core" }
slint = { version = "1.18", features = ["compat-1-2"] }
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
rfd = "0.15"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
] }

[build-dependencies]
slint-build = "1.18"
